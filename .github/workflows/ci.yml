# Intégration continue : vérifie chaque service puis construit et publie les images Docker (GHCR).
# Le déploiement continu est assuré par l'intégration Git Vercel :
#   develop -> préproduction (preprod.guevel-shop.xyz) | main -> production (guevel-shop.xyz)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité - ESLint et Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Génération de la documentation (échoue si un commentaire JSDoc est invalide)
        run: npm run docs

  services:
    name: Node - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, gateway, microservices/notifications, microservices/stock-management]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Chargement de l'application (détecte les erreurs de syntaxe / dépendances manquantes)
        run: node -e "require('./app')"
      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high

  integration:
    name: Intégration - API + MongoDB (test de fumée)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017/exam1_ci
      APP_ENV: ci
      PORT: 5000
      COOKIE_SECURE: 'false'
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.test
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Secrets éphémères propres au run (jamais versionnés)
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=Ci-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: backend
      - name: Jeu de données (produits + admin)
        run: node seeder.js
        working-directory: backend
      - name: Démarrage de l'API
        run: |
          node server.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/health && exit 0; sleep 1; done
          cat api.log; exit 1
        working-directory: backend
      - name: Test de fumée (fonctionnel + sécurité)
        run: |
          echo "ADMIN_USERNAME=$ADMIN_USERNAME" > ci.env
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> ci.env
          node scripts/smoke-test.js ci.env http://localhost:5000

  frontend:
    name: Frontend - tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests unitaires (Vitest)
        run: npm test
      - name: Build de production (Vite)
        run: npm run build

  docker:
    name: Docker - ${{ matrix.image }}
    needs: [quality, services, integration, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: gateway
            context: gateway
          - image: notifications
            context: microservices/notifications
          - image: stock-management
            context: microservices/stock-management
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Nom du registre en minuscules et tag valide (exigences GHCR / Docker)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          # Sur une pull request, ref_name vaut "<n>/merge" : le "/" est interdit dans un tag Docker
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "TAG=${REF//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (et push sur les branches main/develop)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/guevel-shop-${{ matrix.image }}:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/guevel-shop-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
