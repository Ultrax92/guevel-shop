# Intégration continue : vérifie chaque service puis construit et publie les images Docker (GHCR).
# Le déploiement continu est assuré par l'intégration Git Vercel :
#   develop -> préproduction (preprod.guevel-shop.xyz) | main -> production (guevel-shop.xyz)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  services:
    name: Node - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, gateway, microservices/notifications, microservices/stock-management]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: Chargement de l'application (détecte les erreurs de syntaxe / dépendances manquantes)
        run: node -e "require('./app')"
      - name: Audit de sécurité des dépendances
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build de production (warnings ESLint bloquants, comme sur Vercel)
        run: npm run build
        env:
          CI: true

  docker:
    name: Docker - ${{ matrix.image }}
    needs: [services, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: gateway
            context: gateway
          - image: notifications
            context: microservices/notifications
          - image: stock-management
            context: microservices/stock-management
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Nom du registre en minuscules et tag valide (exigences GHCR / Docker)
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          # Sur une pull request, ref_name vaut "<n>/merge" : le "/" est interdit dans un tag Docker
          REF="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "TAG=${REF//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (et push sur les branches main/develop)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/guevel-shop-${{ matrix.image }}:${{ env.TAG }}
            ghcr.io/${{ env.OWNER }}/guevel-shop-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
